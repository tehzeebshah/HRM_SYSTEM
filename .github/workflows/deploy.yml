name: Deploy

# Builds the api + web Docker images, pushes them to GHCR, then SSH-deploys
# to the Plesk VPS. Staging deploys from `staging`; production from `main`.

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------------
  # 1. Build images and push to GHCR
  # ------------------------------------------------------------------
  publish:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.sha }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag & channel
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            echo "channel=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.GHCR_OWNER }}/hrms-api:${{ steps.meta.outputs.channel }}
            ${{ env.REGISTRY }}/${{ secrets.GHCR_OWNER }}/hrms-api:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.GHCR_OWNER }}/hrms-web:${{ steps.meta.outputs.channel }}
            ${{ env.REGISTRY }}/${{ secrets.GHCR_OWNER }}/hrms-web:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # 2. SSH into the VPS, pull, migrate, restart
  # ------------------------------------------------------------------
  deploy:
    name: SSH deploy to Plesk VPS
    runs-on: ubuntu-latest
    needs: publish
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PLESK_HOST }}
          username: ${{ secrets.PLESK_SSH_USER }}
          key: ${{ secrets.PLESK_SSH_KEY }}
          port: 22
          script_stop: true
          envs: IMAGE_TAG
          script: |
            cd /opt/hrms
            export IMAGE_TAG='${{ needs.publish.outputs.tag }}'

            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod \
              run --rm api node node_modules/.bin/prisma migrate deploy
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

      - name: Health gate
        run: |
          sleep 10
          code=$(curl -fsS -o /dev/null -w "%{http_code}" "https://${{ secrets.DEPLOY_DOMAIN }}/api/health" || true)
          echo "Health status: $code"
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then
            echo "::error::Deploy health check failed (HTTP $code)"
            exit 1
          fi

      - name: Report
        run: |
          echo "### Deploy succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "- Channel: ${{ needs.publish.outputs.channel }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: ${{ needs.publish.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://${{ secrets.DEPLOY_DOMAIN }}" >> "$GITHUB_STEP_SUMMARY"
